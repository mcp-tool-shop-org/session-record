summary: "A private Python package that stores a session as addresses a later turn can open."
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: root
    globs:
      - "*"
    role: config
  - name: src
    globs:
      - src/**
    role: code
  - name: tests
    globs:
      - tests/**
    role: test
