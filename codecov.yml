# The bar is 90% on the whole package and on the lines a pull request changes.
# pytest --cov-fail-under=90 enforces the same number before this upload.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: false
  require_changes: false
